<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5AM Runners – Monthly Mileage Challenge</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f2430;--mu:#6b7280;--ac:#e8590c;--ok:#2f9e44;--bd:#e8e2d8;--tr:#eee8de}
@media(prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1f232b;--tx:#eef0f4;--mu:#9aa3b2;--bd:#2f3541;--tr:#2b303a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:22px 0 8px}
.sub{color:var(--mu);font-size:13px}
.nav{display:flex;gap:8px;align-items:center;margin:12px 0}.nav b{flex:1;text-align:center;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
.award{display:flex;gap:10px;align-items:center;margin-bottom:8px}.award .e{font-size:24px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rk{color:var(--mu);width:26px;display:inline-block}.nm{font-weight:600}
.km{font-variant-numeric:tabular-nums;font-size:14px}
.bar{height:8px;background:var(--tr);border-radius:99px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}.bar i.d{background:var(--ok)}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input[type=number]{width:90px}input.w{flex:1;min-width:120px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}
button.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button:disabled{opacity:.35;cursor:default}
.ed{display:none;margin-top:8px}.ed.on{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea{width:100%;height:200px;font-size:13px}
.badge{font-size:12px;color:var(--ok);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--bd)}
tr.h{cursor:pointer}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;display:none;font-size:13px}
.nm{cursor:pointer;text-decoration:underline;text-decoration-color:var(--bd);text-underline-offset:3px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.on{display:flex}
#mc{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead h3{margin:0;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.mbars{margin:10px 0}
.mbar{display:grid;grid-template-columns:70px 1fr 80px;gap:8px;align-items:center;margin-bottom:6px;font-size:12px}
.mbar .bt{height:14px;background:var(--tr);border-radius:4px;overflow:hidden}
.mbar .bt i{display:block;height:100%;background:var(--ac);border-radius:4px}
.mbar .bt i.d{background:var(--ok)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.bch{background:var(--tr);border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap}
select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
a.btn{display:inline-block;background:var(--ac);color:#fff;border-radius:8px;padding:7px 9px;text-decoration:none}
input[type=date]{width:auto}
.ev .when{color:var(--ac);font-weight:600;font-size:13px;white-space:nowrap}
.ev .meta{margin:4px 0}
.bib{display:inline-block;background:var(--tr);border-radius:6px;padding:2px 8px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>🏃 5AM Runners – Monthly Mileage Challenge</h1>
  <div class="sub">Track in Strava · log your kms here · everyone sees live totals</div>
  <div id="setup" class="card" style="display:none;margin-top:12px">Add your Supabase URL and key at the top of the script in this file (see setup steps).</div>
  <div class="nav"><button class="g" onclick="shift(-1)">◀</button><b id="ml"></b><button class="g" id="nb" onclick="shift(1)">▶</button></div>
  <div class="grid" id="stats"></div>
  <div class="card" id="awards"></div>
  <h2>Leaderboard</h2>
  <div id="list"></div>
  <div class="act" id="copyrow" style="display:none"><button class="g" onclick="copyPrev()">Start this month: copy runners &amp; targets from last month</button></div>
  <div id="evsec" style="display:none">
    <h2>🏁 Upcoming events</h2>
    <div id="evlist"></div>
    <div class="act"><button class="g" onclick="document.getElementById('evform').classList.toggle('on')">+ Add event</button></div>
    <div class="ed" id="evform">
      <input class="w" id="evn" placeholder="Event name" maxlength="80">
      <input type="date" id="evd" aria-label="Event date">
      <input class="w" id="evl" placeholder="Location" maxlength="80">
      <input class="w" id="evx" placeholder="Distances (e.g. 10K, 21K)" maxlength="60">
      <input class="w" id="evu" placeholder="Registration link (https://...)" inputmode="url">
      <button onclick="addEvent()">Save event</button>
    </div>
  </div>
  <h2>Join / add runner</h2>
  <div class="act"><input class="w" id="an" placeholder="Name"><input type="number" id="at" placeholder="Target km" min="1"><button onclick="addRunner()">Add</button></div>
  <h2>WhatsApp message</h2>
  <textarea id="msg" readonly></textarea>
  <div class="act" style="margin-top:8px"><button id="cp" onclick="copyMsg()">Copy message</button></div>
  <h2>Month history</h2>
  <div class="card" style="padding:6px 10px"><table id="hist"></table></div>
</main>
<div id="toast"></div>
<div id="ov" onclick="if(event.target===this)closeModal()"><div id="mc"></div></div>
<script>
var SB_URL="https://dwdediridaxulihelhpp.supabase.co",SB_KEY="sb_publishable_e5zdZRXtLAPPJ4mmC41cYw_n0aZYdXS";
var CUR=ym(new Date());
var M=CUR,R=[],ALL=[];
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function lbl(m){var p=m.split("-");return new Date(p[0],p[1]-1,1).toLocaleString("en",{month:"long",year:"numeric"})}
function goTo(m){M=m>CUR?CUR:m;load()}
function shift(n){var p=M.split("-"),nx=ym(new Date(p[0],p[1]-1+n,1));goTo(nx)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f(n){return Math.round(n*100)/100}
function pct(x){return x.km/x.target*100}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2500)}
function api(p,o){o=o||{};return fetch(SB_URL+"/rest/v1/"+p,{method:o.method||"GET",body:o.body?JSON.stringify(o.body):undefined,headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",Prefer:o.prefer||"return=minimal"}}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(t)});return r.text().then(function(t){return t?JSON.parse(t):null})})}
function err(e){toast(/duplicate|23505/.test(e.message)?"That runner already exists this month":"Something went wrong, try again")}
function load(){
  if(SB_URL.indexOf("PASTE")==0){document.getElementById("setup").style.display="block";return}
  document.getElementById("ml").textContent=lbl(M);
  document.getElementById("nb").disabled=(M>=CUR);
  Promise.all([api("runners?month=eq."+M+"&select=*"),api("runners?select=month,name,km,target")]).then(function(a){R=a[0]||[];ALL=a[1]||[];render();loadEvents()}).catch(err)
}
function render(){
  var r=R.slice().sort(function(a,b){return b.km-a.km}),tot=0,ach=0;
  r.forEach(function(x){tot+=+x.km;if(x.km>=x.target)ach++});
  document.getElementById("stats").innerHTML=[[r.length,"Runners"],[f(tot)+" km","Total distance"],[ach,"Target achievers"]].map(function(s){return '<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("");
  var mp=R.slice().sort(function(a,b){return pct(b)-pct(a)})[0];
  var hasLogged=r.some(function(x){return x.km>0});
  document.getElementById("awards").innerHTML=!r.length?"No runners yet this month":!hasLogged?"No runs logged yet this month":'<div class="award"><span class="e">🥇</span><div><b>Most kilometres</b><br>'+esc(r[0].name)+' – '+f(r[0].km)+' km</div></div><div class="award" style="margin:0"><span class="e">🎯</span><div><b>Highest % of target</b><br>'+esc(mp.name)+' – '+Math.round(pct(mp))+'%</div></div>';
  document.getElementById("copyrow").style.display=r.length?"none":"flex";
  document.getElementById("list").innerHTML=r.map(function(x,i){var p=pct(x),d=x.km>=x.target;
    return '<div class="row"><div class="top"><span><span class="rk">'+(i+1)+'</span><span class="nm" onclick="openProfile(\''+esc(x.name).replace(/'/g,"\\'")+'\')">'+esc(x.name)+'</span> '+(d?'<span class="badge">✅ Achieved</span>':'')+'</span><span class="km">'+f(x.km)+' / '+f(x.target)+' km · '+Math.round(p)+'%</span></div><div class="bar"><i class="'+(d?'d':'')+'" style="width:'+Math.min(p,100)+'%"></i></div>'+
    '<div class="act"><input type="number" step="0.01" min="0" placeholder="+ km" id="a'+x.id+'"><button onclick="addKm('+x.id+')">Add run</button><button class="g" onclick="tog('+x.id+')">Edit</button></div>'+
    '<div class="ed" id="e'+x.id+'"><label class="sub">Total <input type="number" step="0.01" id="k'+x.id+'" value="'+x.km+'"></label><label class="sub">Target <input type="number" id="t'+x.id+'" value="'+x.target+'"></label><button onclick="save('+x.id+')">Save</button><button class="g" onclick="del('+x.id+')">Remove (admin)</button></div></div>'}).join("");
  var L=["🏃‍♂️ *5AM Runners – MMC "+lbl(M)+"* 🏃‍♀️",""];
  if(!hasLogged){
    r.slice().sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(x){L.push("• "+x.name+" – target "+f(x.target)+" km")});
    L.push("","No runs logged yet this month. Log your kms to appear on the leaderboard!","Every kilometre counts! 💛 Team 5AM Runners");
  }else{
    var mi=["🥇","🥈","🥉"];
    r.forEach(function(x,i){L.push((mi[i]||(i+1)+".")+" "+x.name+" – "+f(x.km)+"/"+f(x.target)+(x.km>=x.target?" ✅":""))});
    L.push("","Total: "+f(tot)+" km · Achievers: "+ach+"/"+r.length,"Every kilometre counts! 💛 Team 5AM Runners");
  }
  document.getElementById("msg").value=L.join("\n");
  var H={};ALL.forEach(function(x){var h=H[x.month]||(H[x.month]={n:0,t:0,a:0,top:null});h.n++;h.t+=+x.km;if(x.km>=x.target)h.a++;if(!h.top||x.km>h.top.km)h.top=x});
  document.getElementById("hist").innerHTML='<tr><th>Month</th><th>Runners</th><th>Total km</th><th>Achievers</th><th>Top</th></tr>'+Object.keys(H).filter(function(k){return k<=CUR}).sort().reverse().map(function(k){var h=H[k];return '<tr class="h" onclick="goTo(\''+k+'\');scrollTo(0,0)"><td>'+lbl(k)+'</td><td>'+h.n+'</td><td>'+f(h.t)+'</td><td>'+h.a+'</td><td>'+esc(h.top.name)+'</td></tr>'}).join("");
}
function closeModal(){document.getElementById("ov").classList.remove("on")}
function openProfile(name){
  var rows=ALL.filter(function(x){return x.name===name&&x.month<=CUR}).sort(function(a,b){return a.month<b.month?-1:1});
  if(!rows.length)return;
  var logged=rows.filter(function(x){return x.km>0});
  var total=0,achCount=0,maxKm=0,best=null;
  rows.forEach(function(x){total+=+x.km;if(x.km>=x.target)achCount++;if(x.km>maxKm){maxKm=x.km;best=x}});
  var avg=logged.length?total/logged.length:0;
  var streak=0;
  for(var i=rows.length-1;i>=0;i--){if(rows[i].km>=rows[i].target&&rows[i].km>0)streak++;else break}
  var badges=[];
  if(streak>=2)badges.push("🔥 "+streak+"-month streak");
  if(total>=100)badges.push("💯 Century club");
  if(total>=500)badges.push("🏅 500km club");
  if(total>=1000)badges.push("🏆 1000km club");
  if(achCount===rows.length&&rows.length>=3)badges.push("⭐ Never missed target");
  var curRow=rows.filter(function(x){return x.month===CUR})[0];
  if(curRow&&curRow.km>0&&curRow.km===maxKm&&rows.length>1)badges.push("📈 Personal best this month");
  var maxBar=Math.max.apply(null,rows.map(function(x){return Math.max(x.km,x.target)}).concat([1]));
  var bars=rows.slice().reverse().map(function(x){var p=x.km/x.target*100,d=x.km>=x.target;
    return '<div class="mbar"><span>'+lbl(x.month).split(" ")[0].slice(0,3)+' '+x.month.slice(2,4)+'</span><span class="bt"><i class="'+(d?'d':'')+'" style="width:'+Math.min(x.km/maxBar*100,100)+'%"></i></span><span>'+f(x.km)+'/'+f(x.target)+'</span></div>'}).join("");
  document.getElementById("mc").innerHTML=
    '<div class="mhead"><h3>'+esc(name)+'</h3><button class="g" onclick="closeModal()">Close</button></div>'+
    '<div class="mgrid">'+[[f(total)+" km","Lifetime total"],[logged.length+"/"+rows.length,"Months active"],[f(avg)+" km","Avg / month"]].map(function(s){return '<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join("")+'</div>'+
    (badges.length?'<div class="badges">'+badges.map(function(b){return '<span class="bch">'+b+'</span>'}).join("")+'</div>':'')+
    (best&&best.km>0?'<div class="sub">🌟 Best month: '+lbl(best.month)+' – '+f(best.km)+' km</div>':'')+
    '<h2>Month-wise log</h2><div class="mbars">'+(bars||'<div class="sub">No history yet</div>')+'</div>';
  document.getElementById("ov").classList.add("on");
}
/* ---------- Events & bibs ---------- */
var EV=[],BIBS=[];
function ymd(d){return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){var p=s.split("-");return new Date(p[0],p[1]-1,p[2])}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:""}
function copyText(t){
  var done=function(){toast("Copied ✓")};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){toast("Select and copy")});return}
  var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
  var ok=false;try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(a);toast(ok?"Copied ✓":"Select and copy")
}
function loadEvents(){
  var t=ymd(new Date());
  return Promise.all([api("events?event_date=gte."+t+"&order=event_date.asc&select=*"),api("event_bibs?select=*")]).then(function(a){
    EV=a[0]||[];BIBS=a[1]||[];
    document.getElementById("evsec").style.display="block";
    renderEvents()
  }).catch(function(){})
}
function renderEvents(){
  var t0=pd(ymd(new Date()));
  document.getElementById("evlist").innerHTML=EV.length?EV.map(function(e){
    var days=Math.round((pd(e.event_date)-t0)/86400000),when=days===0?"Today":days===1?"Tomorrow":"in "+days+" days";
    var ds=pd(e.event_date).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    var meta=["📅 "+ds].concat(e.location?["📍 "+esc(e.location)]:[]).concat(e.distances?["🏃 "+esc(e.distances)]:[]).join(" · ");
    var url=safeUrl(e.reg_url),n=BIBS.filter(function(b){return b.event_id===e.id}).length;
    return '<div class="row ev"><div class="top"><b>'+esc(e.name)+'</b><span class="when">'+when+'</span></div><div class="sub meta">'+meta+'</div>'+
      '<div class="act" style="margin-top:8px">'+(url?'<a class="btn" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Register ↗</a>':'')+
      '<button onclick="openBibs('+e.id+')">🎽 Bibs ('+n+')</button><button class="g" onclick="delEvent('+e.id+')">Remove (admin)</button></div></div>'
  }).join(""):'<div class="card sub">No upcoming events yet. Add one below!</div>'
}
function addEvent(){
  var n=document.getElementById("evn").value.trim(),d=document.getElementById("evd").value,
      l=document.getElementById("evl").value.trim(),x=document.getElementById("evx").value.trim(),u=document.getElementById("evu").value.trim();
  if(!n||!d)return toast("Enter event name and date");
  if(d<ymd(new Date()))return toast("Date can't be in the past");
  if(u&&!safeUrl(u))return toast("Link must start with http:// or https://");
  api("events",{method:"POST",body:{name:n,event_date:d,location:l||null,distances:x||null,reg_url:u||null}}).then(function(){
    ["evn","evd","evl","evx","evu"].forEach(function(i){document.getElementById(i).value=""});
    document.getElementById("evform").classList.remove("on");
    toast("Event added");loadEvents()
  }).catch(err)
}
function delEvent(id){
  var p=prompt("Admin PIN to remove this event (its bibs are removed too):");if(!p)return;
  api("rpc/delete_event",{method:"POST",prefer:"return=representation",body:{p_id:id,p_pin:p}}).then(function(ok){toast(ok?"Event removed":"Wrong PIN");loadEvents()}).catch(err)
}
function evNames(){
  var s={};ALL.forEach(function(x){if(x.month===CUR)s[x.name]=1});
  var a=Object.keys(s);if(!a.length)ALL.forEach(function(x){s[x.name]=1}),a=Object.keys(s);
  return a.sort(function(a,b){return a.localeCompare(b)})
}
function bibsFor(id){return BIBS.filter(function(b){return b.event_id===id}).sort(function(a,b){return a.runner_name.localeCompare(b.runner_name)})}
function openBibs(id){
  var e=EV.filter(function(x){return x.id===id})[0];if(!e)return;
  var b=bibsFor(id),names=evNames(),have={};b.forEach(function(x){have[x.runner_name]=1});
  var missing=names.filter(function(n){return !have[n]});
  document.getElementById("mc").innerHTML=
    '<div class="mhead"><h3>🎽 '+esc(e.name)+'</h3><button class="g" onclick="closeModal()">Close</button></div>'+
    '<div class="sub">'+b.length+' of '+names.length+' runners have shared their bib</div>'+
    '<h2>Share your bib</h2><div class="act">'+
      '<select id="bn" onchange="fillBib('+id+')"><option value="">Select your name</option>'+names.map(function(n){return '<option>'+esc(n)+'</option>'}).join("")+'</select>'+
      '<input id="bc" class="w" placeholder="Category (10K, 21K…)" maxlength="20">'+
      '<input id="bb" placeholder="Bib no." maxlength="12" style="width:100px">'+
      '<button onclick="saveBib('+id+')">Save</button></div>'+
    '<div class="sub" style="margin-top:4px">Picked the wrong bib? Save again with the same name to update it.</div>'+
    '<h2>Bib list</h2>'+(b.length?'<div class="card" style="padding:6px 10px"><table><tr><th>Runner</th><th>Category</th><th>Bib</th></tr>'+
      b.map(function(x){return '<tr><td>'+esc(x.runner_name)+'</td><td>'+esc(x.category||"–")+'</td><td><span class="bib">'+esc(x.bib)+'</span></td></tr>'}).join("")+'</table></div>':'<div class="sub">No bibs shared yet.</div>')+
    (missing.length?'<div class="sub" style="margin-top:8px">⏳ Yet to share: '+missing.map(esc).join(", ")+'</div>':'')+
    (b.length?'<div class="act" style="margin-top:10px"><button class="g" onclick="copyBibs('+id+')">Copy list for WhatsApp</button></div>':'');
  document.getElementById("ov").classList.add("on")
}
function fillBib(id){
  var n=document.getElementById("bn").value,x=bibsFor(id).filter(function(y){return y.runner_name===n})[0];
  document.getElementById("bc").value=x&&x.category?x.category:"";
  document.getElementById("bb").value=x?x.bib:""
}
function saveBib(id){
  var n=document.getElementById("bn").value,c=document.getElementById("bc").value.trim(),b=document.getElementById("bb").value.trim();
  if(!n)return toast("Select your name");
  if(!b)return toast("Enter your bib number");
  api("event_bibs?on_conflict=event_id,runner_name",{method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:{event_id:id,runner_name:n,category:c||null,bib:b}}).then(function(){
    toast("Bib saved ✓");loadEvents().then(function(){openBibs(id)})
  }).catch(err)
}
function copyBibs(id){
  var e=EV.filter(function(x){
